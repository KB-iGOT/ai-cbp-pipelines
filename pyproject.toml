[project]
name = "ai-cbp-pipelines"
version = "0.1.0"
description = "Kafka pipelines that keep iGOT CBP course data in sync with KB courses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.15.0",
    "asyncpg>=0.30.0",
    "beautifulsoup4>=4.12.0",
    "google-genai>=1.20.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
